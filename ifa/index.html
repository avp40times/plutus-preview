<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Plutus for advisers</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#faf8f3" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Plutus" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --paper: #faf8f3;
                --ink: #14213d;
                --ink-2: #36435c;
                --muted: #5b6478;
                --rule: #cfc8b8;
                --surface: #ffffff;
            }
            * { box-sizing: border-box; }
            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--paper);
            }
            .staticrypt-content {
                min-height: 100%;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--paper);
                color: var(--ink);
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
            }
            .staticrypt-page {
                width: 100%;
                max-width: 390px;
                margin: 0 auto;
                padding: 24px 0 32px;
            }
            .staticrypt-form {
                background: transparent;
                box-shadow: none;
                padding: 0;
                text-align: left;
                max-width: none;
                margin: 0;
            }
            .staticrypt-hr { display: none; }
            .staticrypt-instructions { margin: 0 0 28px; }
            .staticrypt-instructions .staticrypt-title {
                font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                font-weight: 400;
                font-size: 32px;
                line-height: 1.15;
                letter-spacing: -0.015em;
                color: var(--ink);
                margin: 0 0 8px;
            }
            .staticrypt-instructions p:not(.staticrypt-title) {
                margin: 0;
                font-size: 16px;
                line-height: 1.5;
                color: var(--muted);
            }
            .staticrypt-password-container {
                position: relative;
                background: var(--surface);
                border: 1px solid var(--rule);
                margin: 0 0 12px;
            }
            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                font-size: 16px;
                line-height: 1.4;
                outline: 0;
                padding: 14px 44px 14px 14px;
                width: 100%;
                min-height: 48px;
                color: var(--ink);
                font-family: inherit;
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.55;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }
            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: var(--ink);
                width: 100%;
                border: 0;
                min-height: 48px;
                padding: 14px 16px;
                color: #ffffff;
                font-size: 16px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #22345a;
                filter: none;
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 12px;
                font-size: 14px;
                color: var(--muted);
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: none;
                width: 18px;
                height: 18px;
                margin-right: 10px;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 1.5rem;
                height: 1.5rem;
                border: 0.2em solid #cfc8b8;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner { animation: none; }
            }
        </style>
    </head>
